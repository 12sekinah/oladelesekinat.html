<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | NFT preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    body {
      background-color: hsl(217, 54%, 11%);
      margin: 0px;
      width: 1440px;
    }
    .main {
      background-color:  hsl(216, 50%, 16%);
      display: block;
      margin: auto;
      width: 27%;
      margin-top: 20px;
      font-family: "outfit" sans-serif;
      font-size: 18px;
      border-radius: 10px;
    }
  .image-container {
    display: block;
    margin: auto;
    width: 90%;
    height: 300px;
    object-fit: contain;
    position: relative;
    padding-top: 10px;
    padding-left: 7px;
  }
  .image-container img {
    height: auto;
    position: absolute;
    display: block;
    margin: auto;
    width: 97%;
   }
    .main-image {
      width: 300px;
      height: 300px;
      object-fit: contain;
  }
  .image-container .hover-image {
    position: absolute;
    display: block;
    margin: auto;
    width: 50%;
    top: 0;
    right: 0;
    left: 0;
    bottom: 0;
    object-fit: contain;
    opacity: 0;
    transition: opacity .2s;
    height: 150px;
    width: 150px;
  }
  .image-container:hover .hover-image {
    opacity: 1;
  }
    #first-word {
      color: white;
      margin-left: 40px;
      font-weight: 600;  
      margin-top: 60px;
  }
    #second-word {
      color: hsl(215, 51%, 70%);
      margin-left: 40px;
      font-weight: 400;
      font-size: 18px;
    }
    .number {
    display: flex;
    align-items: center;
    gap: 5px;
    color: hsl(178, 100%, 50%);
    margin-left: 20px;
  }
  .time {
    display: flex;
    justify-content: end;
    align-items: center;
    gap: 5px;
    margin-top: -55px;
    color: hsl(215, 51%, 70%);
  }
    .ruler {
      border-bottom: 1px solid hsl(215, 51%, 70%);
      width: 350px;
      margin-left: 25px;
    }
    .avatar {
      display: flex;
      align-items: center;
      gap: 10px;
      color:  hsl(215, 51%, 70%);
      margin-top: 10px;
    }
    .image-avatar {
      width: fit-content;
      height: 40px;
      border: 1px solid white;
      border-radius: 50%;
      margin-left: 40px;
    }
    span {
      color: white;
    }
    .attribution {
      font-size: 11px; 
      text-align: center;
    }
    .attribution a {
      color: hsl(228, 45%, 44%); 
    }
    
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
<div class="main">
 <div class="image-container"><img class="main-image" src="./images/image-equilibrium.jpg" alt="main image"/>
  <img class="hover-image" src="./images/icon-view.svg" alt="icon-view"></div>
  <h1 id="first-word">Equilibrium #3429</h1>

 <p id="second-word">Our Equilibrium collection promotes <br>balance and calm.</p> 
<section><div class="ruler"><div class="number"><img src="./images/icon-ethereum.svg" alt="icon-ethereum"/>
   <P>0.041 ETH</P></div>
 <div class="time"><img src="./images/icon-clock.svg" alt="clock"/>
 <p>3 days left</p></div> </div>
  <div class="avatar"><img class="image-avatar" src="./images/image-avatar.png" alt="avatar"/>
 <p>Creation of <span>  Jules Wyvern</span></p></div></section> 

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="12sekinah.io.github">Oladele Sekinah</a>.
  </div>
</div>
</body>
</html>
